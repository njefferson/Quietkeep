name: Spine

# Phase 0 exit criteria run on every change. Doctrine §16.8: make it a gate, not
# an intention. Actions are SHA-pinned (§16.1).

on:
  push:
    branches: [staging, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A GATE WITH NO ANSWER IS NOT A GATE, and the default here is SIX HOURS.
    #
    # A healthy run of this job is about twenty minutes. Left at the default, a
    # single hung step holds the only signal anybody has about a release for the
    # rest of the working day, in a state that reads as "still going" rather than
    # as broken — which is the same shape as the red step nobody noticed for ten
    # runs, one level up. Failing loudly at forty-five minutes is worse than
    # succeeding and far better than never answering.
    timeout-minutes: 45
    steps:
      # fetch-depth: 0 — `release:check` has to find the commit that introduced
      # the current triplet, which a depth-1 clone cannot see. That gate fails
      # loudly rather than skipping on a shallow clone, so this is load-bearing
      # rather than an optimisation someone can tidy away.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
      - run: npm ci

      # FIRST, because a workflow that does not parse fails in under a second
      # with zero jobs — reported as red with nothing readable in it. Cheapest
      # possible check for the least legible possible failure.
      - name: Workflow files parse
        run: npm run workflows:check

      # Doctrine §9b — the FAIL state: nothing personal about the owner lands
      # in this repo. The canonical patterns live in the hub and are widened
      # there, so this step checks the hub out fresh and runs THAT copy —
      # test/privacy.test.ts mirrors the patterns for offline `npm test`, but
      # this is the gate that cannot lag. The path is untracked, so the scan
      # (`git ls-files`) never reads the hub's own files as this repo's.
      - name: Check out the hub's canonical gates
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: njefferson/noahjefferson
          path: .hub-gates
          persist-credentials: false
      - name: The owner's person is not repo material (Doctrine 9b)
        run: node .hub-gates/privacy-check.mjs --repo .

      # test/privacy.test.ts mirrors the hub's patterns so `npm test` fails
      # offline. A mirror that drifts is not a smaller gate, it is a different
      # one — a stale over-broad copy already blocked four consecutive deploys
      # in a sibling repo (LESSONS §53).
      - name: The offline pattern mirror has not drifted from the hub
        run: node .hub-gates/privacy-mirror-check.mjs --repo .

      # THE SECOND HALF OF THE PRIVACY RULE. privacy-check.mjs anchors
      # every pattern on the owner's NAME or role, so it cannot see a verbatim
      # sentence of ordinary speech — five of those were in this repo, and one more in
      # an ADR that had copied one, all of them green on every gate. This holds
      # every set-apart quotation to a declaration saying whose words it is.
      # Runs beside the privacy gate because it is the same rule.
      - name: Every set-apart quotation says whose words it is
        if: ${{ !cancelled() }}
        run: node .hub-gates/quote-check.mjs --repo .

      # THE HOOK THAT ENFORCES THE FRESHNESS RULE IS THE ONE THIS REPO DECLARES.
      # That rule is caught locally by the generated pre-commit hook, which
      # `--no-verify` walks straight past — so the tracked hook is checked here
      # against what `.branch-guard` says it should be. A guard that can be
      # skipped locally and is not verified centrally is a guard that is on
      # until the first time somebody is in a hurry.
      #
      # UP HERE BECAUSE IT NEEDS NOTHING BUT THE TWO CHECKOUTS. It used to sit
      # near the end, behind the browser install and every walk — so a failure
      # in a check that takes under a second was reported twenty-odd minutes
      # into a run, if the run got that far at all. It was red for ten runs and
      # its position is part of why nobody saw it. Cheap checks that depend on
      # nothing belong where a failure is answered in seconds.
      #
      # `.hub-gates` is where this job already checked the hub out — the sibling
      # path this is run from locally does not exist in CI, and a step that
      # cannot find its tool is a step that fails for the wrong reason.
      #
      # `--artefact` BECAUSE THIS STEP FAILED EVERY TIME WITHOUT IT, and did so
      # from the commit that added it. The plain check also asserts that
      # `.git/hooks/pre-commit` is installed and current, which is a fact about
      # one CLONE — and `actions/checkout` leaves `.git/hooks` empty by
      # definition, so it can never hold here. Ten runs since the step was added
      # — seven concluding failure, three cancelled by a superseding push, none
      # ever green; the step was watched passing LOCALLY, where the hook is
      # installed, which is the one place it proves nothing about CI.
      #
      # What CI can check, and what this now checks, is the tracked artefact
      # against what `.branch-guard` declares — the drift that would leave every
      # developer clone running a rule the repo no longer states. Verified by
      # planting that drift and watching this exact command exit 1.
      #
      # Not `--install` first: that WRITES the tracked file, so a drifted
      # artefact would be repaired on the spot and the check would pass over the
      # one defect it exists to find.
      - name: The commit guard is the one that was declared
        run: node .hub-gates/branch-guard.mjs --repo . --artefact


      - run: npm run typecheck
      - run: npm run test:only

      # The brand assets carry measured contrast ratios (ACCESSIBILITY.md B-10).
      # Checking them here means a change to icon.svg or the social preview cannot
      # quietly drop below 3:1 — B-08's rule is that a new pair joins the gate in
      # the same commit that introduces it, and this is that gate.
      # ITS OWN DEADLINE — A SAFETY NET, NOT A DIAGNOSIS.
      #
      # This step's duration VARIES a lot. Completed observations, read off the
      # run timestamps: 24s (32261983527), 1m57s (32298044605), 4m45s
      # (32297560926). All three succeeded. Everything below waits behind it, so
      # a bad enough day here costs the whole gate.
      #
      # THERE IS NO OBSERVED HANG, and this comment claimed one twice before it
      # said this. The single long reading — 10m35s on run 32296164308 — ended
      # because that run was CANCELLED by a subsequent push, not because the step
      # gave up; nobody ever let it finish. Three separate pushes in ten minutes
      # cancelled three runs in a row, and the truncated observations were then
      # read as evidence of stalling. They are evidence of cancelling.
      #
      # So ten minutes is headroom over the slowest completed run, not a fence
      # around a known fault. It exists for the same reason as the job timeout
      # above: a gate that never answers is worse than one that fails.
      - name: Install chromium for the browser checks
        timeout-minutes: 10
        run: npx --no-install playwright-core install --with-deps chromium
      - name: Brand assets
        run: npm run brand:check

      # ONE RED STEP MUST NOT SILENCE THE INDEPENDENT ONES BELOW IT.
      #
      # A failed step stops every step after it, and that is how a single red
      # gate took seven others down with it: when the commit guard failed at
      # position 30, steps 31 to 37 were `skipped` on every one of those runs —
      # controls, collisions, adr, touch, notify, sample and storage. Seven gates
      # were not running in CI at all, and the page said `skipped`, which reads
      # as deliberate rather than as lost.
      #
      # So every gate below that needs nothing but the checkout carries
      # `if: ${{ !cancelled() }}`: it runs whether or not something earlier
      # failed, and the job still ends red. `!cancelled()` rather than `always()`
      # so a cancelled run does not keep grinding through checks nobody is
      # waiting for.
      #
      # NOT on the browser and build steps — `brand`, `smoke`, `update:walk`,
      # `a11y`, `size`, `build:sync`, `touch` — those genuinely need the chromium
      # install or `npm run build` to have happened, and running them anyway
      # would report a missing prerequisite as a gate failure, which is the false
      # accusation this repo has already paid for twice.

      # Doctrine §7: the changelog's head triplet and the service-worker cache
      # name bump together. A rule someone has to remember, until it is a check.
      - name: Changelog and triplet
        if: ${{ !cancelled() }}
        run: npm run changelog:check

      # And that the triplet has not stood still while the app moved. The check
      # above compares the changelog head against the cache name — both can agree
      # on a STALE number, which is exactly what happened on 9 August: a new
      # surface shipped with no entry and no cache bump, so no worker installed
      # and every already-installed reader kept the old bundle. Published, and
      # unable to arrive.
      - name: The shipped surface is not newer than the release
        if: ${{ !cancelled() }}
        run: npm run release:check

      # The hosted "why it works this way" page is GENERATED from the rationale
      # doc (tools/thesis.mjs), so the two cannot drift — same rule as the
      # changelog, so it earns the same gate.
      - name: Thesis page in sync with the doc
        if: ${{ !cancelled() }}
        run: npm run thesis:check

      # The unit tests prove the spine folds. They cannot prove the bundle
      # loads, that Dexie opens in a browser, or that a captured thought comes
      # back — which is the app's one promise. Only driving the built page does
      # that, so the build and the walk are both gates (build-plan §4).
      - run: npm run build
      - name: Headless walk of the built app
        run: npm run smoke

      # Doctrine §7h asks for a REAL second worker rather than a mocked
      # registration, because a mock proves the mock works. This serves a
      # genuinely different sw.js and lets Chromium's own update machinery run.
      # It found a live §7h.3 defect on its first run that the source-reading
      # unit tests could not see.
      - name: A real second worker waits for the reader
        run: npm run update:walk

      # The rendered app, audited: contrast computed per state in both themes,
      # axe per state, targets, and B-04's hardest viewport (320px at 200%
      # text). This is B-08's claimed gate actually existing for the app, not
      # only for the brand tokens. Its first run caught a real defect (F-01).
      - name: Rendered accessibility
        run: npm run a11y

      # HOW MUCH IS THERE TO GET THROUGH. Reported on a real device: finding one
      # button took minutes of scrolling and reading. Every rule in the doctrine
      # says explain it and say why; applied release by release they are each
      # defensible, and nothing measured the SUM — so the shell reached 5,702
      # words with every gate green. This is the gate that counts.
      - name: Within the reading budget
        run: npm run size:check

      # ADR-0036: the default build's guarantee is that the BROWSER refuses to
      # let it reach another host. That is one line of _headers, so it is gated —
      # it is exactly the kind of thing that erodes quietly.
      - name: Network posture
        if: ${{ !cancelled() }}
        run: npm run headers:check

      # ADR-0036's OTHER half. `headers:check` proves the default origin cannot
      # reach anywhere; this proves the sync module is not in the default bundle
      # at all — read out of the built artefact, and with the marker list itself
      # checked against a sync build so the gate cannot pass by testing for words
      # nothing emits.
      - name: Two editions
        run: npm run build:sync

      # The vocabulary is a closed list and "overdue"/"streak" are banned
      # outright (ADR-0010). A grep is the cheapest possible gate.
      # ONE definition, in package.json, so `npm run vocabulary` locally is the
      # same check CI runs. It was written out longhand here and approximated by
      # hand at the terminal — which is how 0.15.0 and 0.16.0 passed nine gates
      # locally and went red in CI on the tenth. Two copies of one rule drift.
      - name: No banned vocabulary
        if: ${{ !cancelled() }}
        run: npm run vocabulary

      - name: The app has no pronoun for anybody
        if: ${{ !cancelled() }}
        run: npm run voice:pronouns

      # The closed list, checked against the DOCUMENT that governs it (1.9.1).
      # `isKnownKind` has always refused an unlisted kind at runtime, and
      # nothing ever asked whether the code's list and
      # docs/event-vocabulary.md still name the same events — so the file
      # CLAUDE.md calls the source of truth could drift from the code in
      # silence. It also checks the Silent? column, which the vocabulary
      # itself calls "the machine-checkable form of product law 1" and which
      # nothing had ever machine-checked.
      - name: The closed event list matches the vocabulary
        if: ${{ !cancelled() }}
        run: npm run events:check

      # "Nothing outside the gate imports the store's write API" — claimed in
      # the build plan since it was written, checked by nothing, while four
      # legitimate raw-write sites accumulated (1.9.1). Raw writes are not
      # forbidden; unrecorded ones are. The allowlist carries a reason per
      # entry, and a stale entry fails too.
      - name: No unrecorded write-gate bypass
        if: ${{ !cancelled() }}
        run: npm run writegate:check

      # Twice in one day the same shape landed: `export.written` recorded since
      # Phase 0 and read by nothing, so no surface could say when a copy last
      # left (ADR-0062); `snapshot.written` declared in Phase 0 and written by
      # nothing, so every cold start replayed the whole log (ADR-0063). Both
      # were invisible — a noun nothing writes breaks nothing, it just means a
      # feature the record insists exists does not. Every kind is now either
      # written by the app or says in the vocabulary, in words, that it is not
      # and why. A stale note fails too.
      - name: Every noun accounts for itself
        if: ${{ !cancelled() }}
        run: npm run emitters:check

      # The closed reason vocabulary (V2 stage 7). Determinism is the product:
      # an offer with an unaccountable warrant cannot be refused on grounds, and
      # a reader who cannot predict what the app says cannot tell a change they
      # caused from one they did not. Seven push sites each wrote their own
      # literal before this, and two had independently written the same one.
      - name: Every offer says why, from one closed set with one author
        if: ${{ !cancelled() }}
        run: npm run reasons:check

      # WHAT SURVIVES THE WORST DAY (2.10.0). "Just one thing" strips the offer
      # back to the thing and the acts, and what it strips is a hand-written
      # list — which went stale three times in silence, so on the day the mode
      # exists for the card still said how much of today was left.
      #
      # This is here rather than only in `npm run check` because a gate that is
      # not in CI protects nothing on a push, and it was written the same hour
      # the defect was found: the step list of this very workflow is where its
      # absence was noticed.
      - name: What survives the worst day
        if: ${{ !cancelled() }}
        run: npm run plain:check

      # THE WALKTHROUGH'S PICTURES ARE OF THIS APP (2.10.4). They are rendered
      # from the running app rather than drawn, and this fails once the markup,
      # the stylesheet or any renderer behind them has moved — because a help
      # screen illustrated with a UI that no longer exists is WORSE than one with
      # no pictures at all: prose that is out of date reads as out of date, and a
      # screenshot reads as proof.
      #
      # It needs no browser — it compares a recorded hash and checks the files
      # are on disk — so it belongs in the cheap block rather than beside the
      # walks. Regenerate with `npm run tour:shots`.
      - name: The walkthrough shows this version of the app
        if: ${{ !cancelled() }}
        run: npm run tour:check


      # WHERE THE CONTROLS ARE (V2 stage 7). The shape is fixed forever and the
      # contents change every time — a person's hands learn where Done is, and
      # moving it costs them that silently. A core control's position and label
      # are a compatibility surface: rare, deliberate, and DECLARED, by name, in
      # place-language, in the running release's notes. The manifest alone is
      # bookkeeping; telling the person is the obligation.
      - name: The shape is where it was, or the release says otherwise
        if: ${{ !cancelled() }}
        run: npm run controls:check

      # The collision catalogue stays honest (V2 stage 7). It was a false receipt
      # in both directions — five shipped proposals still marked as candidates,
      # and replicated experimental findings written in the same voice as phrases
      # somebody coined on a forum. Nothing checked it, which is why it drifted.
      # This holds the SHAPE: every entry states how strong its evidence is and
      # how it routes, both from closed sets.
      - name: Every collision says what it is built on
        if: ${{ !cancelled() }}
        run: npm run collisions:check

      # THE QUESTION LIST SAYS WHAT IS OPEN (2026-08-19). Ten of fourteen
      # questions had no status line, so open was inferred from absence — and
      # every one of the ten was already closed, one of them built. The one that
      # did carry a status said "asked, not answered" four lines under its own
      # CLOSED bullet, for two days. Shape only, like collisions:check: it cannot
      # know whether a status is true, but it can refuse a block that says
      # nothing and one that contradicts itself.
      - name: Every question says whether it is still open
        if: ${{ !cancelled() }}
        run: npm run questions:check

      # THE INDEX AGAINST THE RECORDS. docs/adr/README.md went fifteen records
      # stale — 0074 to 0088 — before anyone noticed, including the record
      # written by the session that noticed. A missing row is invisible in a way
      # a wrong row is not: the index reads as complete whatever is absent from
      # it, so there is nothing to see and nothing to click. Checked BOTH ways,
      # because a row pointing at no file survives a rename silently.
      - name: Every decision is in the index, and every row is a real decision
        if: ${{ !cancelled() }}
        run: npm run adr:check

      # A ROUTE A FINGER CANNOT TAKE IS NOT A ROUTE. The reference platform is a
      # tablet, used by touch, and every other gate here measures CONFORMANCE —
      # which is defined for input methods in general. The skip link shipped in
      # the first commit, off-canvas until focused, with `autofocus` in the same
      # commit putting the document's focus after it: never reachable by tabbing
      # forward, never reachable by finger, green everywhere, for 142 releases.
      - name: Every off-canvas route names a way a finger can take it
        run: npm run touch:check

      # NO SENTENCE LEAVES THIS APP UNMEASURED (collision 15). A push reaches
      # somebody who did not open the app, on a lock screen, possibly in front of
      # other people, on a day they may be at their worst — and there is no
      # version of "we will tighten the copy later", because the first bad one has
      # already landed by the time anyone reads it. Nothing emits a notification
      # today; this is armed so the commit that adds one cannot also be the commit
      # that ships an unmeasured sentence.
      - name: No sentence can reach a lock screen unmeasured
        if: ${{ !cancelled() }}
        run: npm run notify:check

      # And every kind is DEMONSTRATED, or says why not (1.16.0, ADR-0067). The
      # sample set was written at 0.22.0 and sixteen releases later contained 8
      # of the 70 kinds the app emits — so every surface built after it had
      # never once been seen with data in it. This generates the set for real,
      # runs it through the write boundary, and asks what came out.
      - name: The sample set covers the app
        if: ${{ !cancelled() }}
        run: npm run sample:check

      # Storage is IndexedDB via Dexie and localStorage is banned outright. That
      # ban rested on review alone until a security audit pointed out it was the
      # only invariant in CLAUDE.md with no gate behind it — unlike connect-src
      # and the vocabulary, both of which fail the build. A rule enforced by
      # remembering is a rule that lapses on a busy afternoon.
      - name: No localStorage
        if: ${{ !cancelled() }}
        run: npm run storage:check
